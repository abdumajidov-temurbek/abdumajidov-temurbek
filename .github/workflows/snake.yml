name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake game from contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: abdumajidov-temurbek
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c71585&color_dots=#ebedf0,#f7c5e0,#ec88c0,#c71585,#8a0e5e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c71585
            dist/github-contribution-grid-snake.gif?color_snake=#c71585&color_dots=#ebedf0,#f7c5e0,#ec88c0,#c71585,#8a0e5e

      - name: Push snake output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
